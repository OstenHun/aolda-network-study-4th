<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" role="img" aria-labelledby="title desc">
<title id="title">Classic congestion window teaching model</title>
<desc id="desc">Synthetic round boundaries. Slow start 1 2 4 8; congestion avoidance to 12; triple duplicate ACK recovery to 6; timeout from 8 to 1. Not a packet capture.</desc>
<rect width="680" height="410" fill="#fcfbf8"/>
<g font-family="sans-serif" font-size="16" fill="#252b2b">
<text x="40" y="28" font-size="20">cwnd / SMSS · synthetic model</text>
<path d="M65 45 V330 H630" fill="none" stroke="#41494b" stroke-width="2"/>
<text x="52" y="354">0</text><text x="610" y="354">14</text><text x="275" y="390">round (one RTT)</text>
<text x="28" y="334">0</text><text x="28" y="246">4</text><text x="28" y="158">8</text><text x="20" y="70">12</text>
<path d="M65 242 H630 M65 154 H630 M65 66 H630" stroke="#d8dddd" stroke-dasharray="4 4"/>
<polyline points="65,308 104,286 143,242 182,154 221,132 260,110 299,88 338,66 377,198 416,176 455,154 494,308 533,286 572,242 611,220" fill="none" stroke="#276a60" stroke-width="3"/>
<text x="70" y="205">slow start</text><text x="190" y="48">avoidance</text>
<text x="333" y="110">3 duplicate ACKs</text><text x="450" y="300">timeout</text>
</g></svg>